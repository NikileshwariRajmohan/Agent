<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>NIRA AI</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(93,70,180,.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(45,100,180,.10),
            transparent 28%
        ),
        #07070a;

    color:white;

    font-family:
        Arial,
        sans-serif;

    overflow-x:hidden;
}


/* =====================================
   BACKGROUND EFFECT
===================================== */

body::before{

    content:"";

    position:fixed;

    width:500px;
    height:500px;

    top:-260px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(125,90,255,.16),
            transparent 70%
        );

    filter:blur(35px);

    pointer-events:none;
}


/* =====================================
   MAIN CARD
===================================== */

.card{

    position:relative;

    width:470px;
    max-width:100%;

    padding:42px 38px 34px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(27,27,34,.96),
            rgba(14,14,18,.96)
        );

    border:1px solid rgba(255,255,255,.10);

    border-radius:26px;

    box-shadow:
        0 30px 90px rgba(0,0,0,.65),
        0 0 60px rgba(85,60,180,.08),
        inset 0 1px 0 rgba(255,255,255,.05);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    overflow:hidden;
}


/* top light */

.card::before{

    content:"";

    position:absolute;

    top:0;
    left:15%;

    width:70%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(150,130,255,.55),
            transparent
        );
}


/* =====================================
   TITLE
===================================== */

.card h2{

    margin:0;

    font-size:38px;

    font-weight:700;

    letter-spacing:-1.5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #b8aaff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}


.card h2::after{

    content:"AI ASSISTANT";

    display:block;

    margin-top:8px;

    font-size:9px;

    font-weight:600;

    letter-spacing:4px;

    color:#777;
}


.card > p{

    margin:18px 0 32px;

    color:#92929a;

    font-size:14px;

    line-height:1.6;
}


/* =====================================
   MICROPHONE
===================================== */

.mic{

    position:relative;

    width:100px;
    height:100px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:50%;

    cursor:pointer;

    font-size:35px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #cfcbdc
        );

    color:#111;

    box-shadow:
        0 0 0 9px rgba(120,90,255,.06),
        0 0 35px rgba(120,90,255,.14),
        0 15px 40px rgba(0,0,0,.55);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


.mic:hover{

    transform:scale(1.07);

    box-shadow:
        0 0 0 11px rgba(120,90,255,.08),
        0 0 45px rgba(120,90,255,.22),
        0 18px 45px rgba(0,0,0,.6);
}


.mic:active{

    transform:scale(.96);
}


/* =====================================
   LISTENING
===================================== */

.mic.listening{

    animation:niraPulse 1.25s ease-in-out infinite;

    box-shadow:
        0 0 0 10px rgba(120,90,255,.08),
        0 0 0 20px rgba(120,90,255,.035),
        0 0 50px rgba(120,90,255,.30);
}


@keyframes niraPulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.09);
    }

    100%{
        transform:scale(1);
    }

}


/* =====================================
   STATUS
===================================== */

.status{

    min-height:22px;

    margin:25px 0 8px;

    color:#aaa;

    font-size:14px;

    font-weight:500;
}


/* =====================================
   COMMAND
===================================== */

.command{

    min-height:28px;

    margin:5px 0 22px;

    padding:0 10px;

    color:#e2e0ea;

    font-size:14px;

    font-weight:500;

    line-height:1.5;

    word-break:break-word;
}


/* =====================================
   EMAIL EDITOR
===================================== */

.editor{

    display:none;

    margin-top:25px;

    padding:22px;

    text-align:left;

    background:
        linear-gradient(
            145deg,
            rgba(12,12,17,.90),
            rgba(17,17,22,.75)
        );

    border:1px solid rgba(255,255,255,.08);

    border-radius:18px;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.03),
        0 15px 35px rgba(0,0,0,.25);
}


.editor::before{

    content:"EMAIL DRAFT";

    display:block;

    margin-bottom:17px;

    color:#746b99;

    font-size:10px;

    font-weight:700;

    letter-spacing:3px;
}


/* =====================================
   RECIPIENT
===================================== */

.recipient{

    margin-bottom:8px;

    padding:8px 2px;

    color:#aaa;

    font-size:13px;
}


/* =====================================
   INPUTS
===================================== */

input,
textarea{

    width:100%;

    margin:6px 0;

    padding:13px 14px;

    background:#101014;

    color:white;

    border:1px solid #30303a;

    border-radius:10px;

    outline:none;

    font-family:Arial,sans-serif;

    font-size:14px;

    transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}


input::placeholder,
textarea::placeholder{

    color:#64646d;
}


input:focus,
textarea:focus{

    background:#15151b;

    border-color:#6655a5;

    box-shadow:
        0 0 0 3px rgba(120,90,255,.08);
}


textarea{

    height:140px;

    resize:vertical;

    line-height:1.5;
}


/* =====================================
   ACTION BUTTONS
===================================== */

button.action{

    width:100%;

    padding:13px 16px;

    margin-top:9px;

    border:1px solid rgba(255,255,255,.10);

    border-radius:10px;

    cursor:pointer;

    font-family:Arial,sans-serif;

    font-size:13px;

    font-weight:600;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}


button.action:hover{

    transform:translateY(-1px);
}


button.action:active{

    transform:translateY(0);
}


/* =====================================
   GMAIL
===================================== */

.primary{

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ded9ed
        );

    color:#111;

    border-color:#ffffff !important;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);
}


.primary:hover{

    background:#ffffff;
}


/* =====================================
   REGENERATE
===================================== */

#regen{

    background:#1c1c22;

    color:#999;
}


#regen:hover{

    background:#27272f;

    color:#fff;

    border-color:#44445a;
}


/* =====================================
   MOBILE
===================================== */

@media(max-width:600px){

    body{

        padding:16px;
    }


    .card{

        width:100%;

        padding:34px 22px 27px;

        border-radius:21px;
    }


    .card h2{

        font-size:32px;
    }


    .card > p{

        margin-bottom:28px;

        font-size:13px;
    }


    .mic{

        width:88px;
        height:88px;

        font-size:32px;
    }


    .editor{

        padding:17px;

        border-radius:15px;
    }

}


/* =====================================
   SMALL MOBILE
===================================== */

@media(max-width:380px){

    body{

        padding:10px;
    }


    .card{

        padding:28px 17px 22px;
    }


    .card h2{

        font-size:29px;
    }


    .mic{

        width:82px;
        height:82px;
    }

}

</style>

</head>


<body>

<div class="card">

    <h2>NIRA AI</h2>

    <p>
        Say a song name or create an email
    </p>


    <button
        id="mic"
        class="mic"
    >
        🎙️
    </button>


    <div
        id="status"
        class="status"
    >
        Tap microphone
    </div>


    <div
        id="command"
        class="command"
    ></div>


    <!-- Gmail Editor -->

    <div
        id="editor"
        class="editor"
    >

        <div
            id="recipient"
            class="recipient"
        ></div>


        <input
            id="subject"
            placeholder="Email subject"
        >


        <textarea
            id="body"
            placeholder="Email body"
        ></textarea>


        <button
            id="open"
            class="action primary"
        >
            Open in Gmail
        </button>


        <button
            id="regen"
            class="action"
        >
            Regenerate
        </button>

    </div>

</div>


<script>

/* --------------------------------------------------
   DOM REFERENCES
-------------------------------------------------- */

const $ =
    id => document.getElementById(id);


const mic =
    $("mic");


const status =
    $("status");


const commandBox =
    $("command");


const editor =
    $("editor");


const recipient =
    $("recipient");


const subject =
    $("subject");


const body =
    $("body");


/* --------------------------------------------------
   SPEECH RECOGNITION
-------------------------------------------------- */

const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition;

let listening = false;


/* --------------------------------------------------
   COMMAND STATE
-------------------------------------------------- */

let lastCommand = "";

let emailGenerated = false;

let generatingEmail = false;

let youtubeTab = null;


/* --------------------------------------------------
   SPEECH RECOGNITION SETUP
-------------------------------------------------- */

if(!SR){

    status.textContent =
        "Speech recognition unavailable";

    mic.disabled = true;

}

else{

    recognition =
        new SR();

    recognition.lang =
        "en-US";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;


    recognition.onstart = () => {

        listening = true;

        mic.classList.add(
            "listening"
        );

        status.textContent =
            "Listening...";

    };


    recognition.onend = () => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

    };


    recognition.onerror = e => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

        status.textContent =
            "Voice error: " +
            e.error;

    };


    recognition.onresult = e => {

        const text =
            e.results[0][0]
            .transcript
            .trim();


        if(!text){

            status.textContent =
                "No command detected";

            return;

        }


        lastCommand =
            text;


        commandBox.textContent =
            text;


        processCommand(
            text
        );

    };


    mic.onclick = () => {

        if(listening)
            return;


        try{

            recognition.start();

        }

        catch(e){

            console.log(e);

        }

    };

}


/* --------------------------------------------------
   GMAIL KEYWORD DETECTION
-------------------------------------------------- */

function isGmail(command){

    const hasCreate =
        /\bcreate\b/i.test(command);


    const hasEmail =
        /\bemail\b/i.test(command);


    return (
        hasCreate &&
        hasEmail
    );

}


/* --------------------------------------------------
   YOUTUBE KEYWORD DETECTION
-------------------------------------------------- */

function isYouTube(command){

    return (
        /\bplay\b/i.test(command) ||
        /\bsong\b/i.test(command)
    );

}


/* --------------------------------------------------
   MAIN COMMAND PROCESSOR
-------------------------------------------------- */

async function processCommand(command){

    const gmail =
        isGmail(command);


    const youtube =
        isYouTube(command);


    /* ----------------------------------------------
       GMAIL COMMAND
    ---------------------------------------------- */

    if(gmail){

        if(generatingEmail){

            status.textContent =
                "Email is already being generated...";

            return;

        }


        if(
            emailGenerated &&
            command === lastCommand
        ){

            status.textContent =
                "Email already generated.";

            return;

        }


        generatingEmail = true;


        status.textContent =
            "Generating email...";


        try{

            const response =
                await fetch(
                    "/agent",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })

                    }
                );


            const data =
                await response.json();


            if(
                !response.ok ||
                !data.success
            ){

                throw Error(
                    data.message ||
                    "Email request failed"
                );

            }


            showEmail(
                data
            );


            emailGenerated = true;


        }

        catch(error){

            console.error(
                error
            );


            status.textContent =
                error.message ||
                "Email generation failed";

        }

        finally{

            generatingEmail = false;

        }


        return;

    }


    /* ----------------------------------------------
       YOUTUBE COMMAND
    ---------------------------------------------- */

    else if(youtube){

        status.textContent =
            "Finding song...";


        try{

            const response =
                await fetch(
                    "/youtube/play",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })

                    }
                );


            const data =
                await response.json();


            if(
                !response.ok ||
                !data.success
            ){

                throw Error(
                    data.message ||
                    "YouTube request failed"
                );

            }


            playYouTube(
                data
            );


        }

        catch(error){

            console.error(
                error
            );


            status.textContent =
                error.message ||
                "YouTube request failed";

        }


        return;

    }


    /* ----------------------------------------------
       UNKNOWN COMMAND
    ---------------------------------------------- */

    else{

        status.textContent =
            "Please say 'create email' or 'play song'.";

        return;

    }

}


/* --------------------------------------------------
   SHOW GENERATED EMAIL
-------------------------------------------------- */

function showEmail(data){

    recipient.dataset.email =
        data.recipient || "";


    recipient.textContent =
        data.recipient
        ? "To: " + data.recipient
        : "Recipient not specified";


    subject.value =
        data.subject || "";


    body.value =
        data.body || "";


    editor.style.display =
        "block";


    status.textContent =
        "Email ready. Review or edit it.";

}


/* --------------------------------------------------
   OPEN GMAIL
-------------------------------------------------- */

$("open").onclick = () => {


    const url =
        "https://mail.google.com/mail/u/0/?" +

        new URLSearchParams({

            view:"cm",

            fs:"1",

            to:
                recipient.dataset.email || "",

            su:
                subject.value,

            body:
                body.value

        });


    const win =
        window.open(
            url,
            "NovaGmail"
        );


    if(!win){

        status.textContent =
            "Please allow popups for this site.";

    }

};


/* --------------------------------------------------
   REGENERATE BUTTON
-------------------------------------------------- */

$("regen").onclick = () => {

    status.textContent =
        "Email already generated. Edit the existing email.";

};


/* --------------------------------------------------
   YOUTUBE PLAYBACK
-------------------------------------------------- */

function playYouTube(data){

    if(
        !youtubeTab ||
        youtubeTab.closed
    ){

        youtubeTab =
            window.open(
                data.url,
                "NovaYouTube"
            );

    }

    else{

        youtubeTab.location.href =
            data.url;

        youtubeTab.focus();

    }


    status.textContent =
        "Playing";

}

</script>

</body>

</html>
